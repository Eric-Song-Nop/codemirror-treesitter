name: Workspace CI

# Repository-wide validation gates. Runs on every push and pull request to
# main regardless of changed paths. The Grove CI/CD workflow
# (local-md-workspace.yml) keeps its own deploy-gating validation, and
# release.yml runs `vp run ready` before publishing.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: "26"

      - name: Install dependencies
        run: vp install

      # packages/opendal-wasm-browser/pkg is gitignored; type checking,
      # tests and `vp run -r build` all need the generated WASM bindings.
      - name: Build OpenDAL browser WASM
        run: |
          set -euo pipefail

          rustup target add wasm32-unknown-unknown
          vp run @codemirror-treesitter/opendal-wasm-browser#build:wasm

      - name: Check
        run: vp check

      - name: Verify web-tree-sitter patch
        run: vp run verify:web-tree-sitter

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build

      - name: Audit
        run: vp run audit

      - name: Check Worker types
        run: |
          set -euo pipefail

          vp run collab-editor#types
          vp run grove-relay#types
          if ! git diff --exit-code -- apps/collab-editor/worker-configuration.d.ts apps/grove-relay/worker-configuration.d.ts; then
            echo "::error::Generated Worker types are stale. Run 'vp run collab-editor#types' and 'vp run grove-relay#types' and commit the result."
            exit 1
          fi

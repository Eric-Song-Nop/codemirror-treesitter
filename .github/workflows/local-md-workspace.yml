name: Grove CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/local-md-workspace.yml"
      - "apps/grove-relay/package.json"
      - "apps/grove-relay/src/**"
      - "apps/grove-relay/tsconfig.json"
      - "apps/grove-relay/vite.config.ts"
      - "apps/grove-relay/vitest.config.ts"
      - "apps/grove-relay/worker-configuration.d.ts"
      - "apps/grove-relay/wrangler.jsonc"
      - "apps/grove-relay/wrangler.worker.ci.jsonc"
      - "apps/grove-relay/wrangler.worker.jsonc"
      - "apps/local-md-workspace/index.html"
      - "apps/local-md-workspace/package.json"
      - "apps/local-md-workspace/public/**"
      - "apps/local-md-workspace/scripts/**"
      - "apps/local-md-workspace/src/**"
      - "apps/local-md-workspace/tsconfig.json"
      - "apps/local-md-workspace/vite.config.ts"
      - "bun.lock"
      - "package.json"
      - "packages/autocomplete/**"
      - "packages/codemirror/**"
      - "packages/commands/**"
      - "packages/language/**"
      - "packages/language-data/**"
      - "packages/live-md/**"
      - "packages/live-md-theme/**"
      - "packages/live-md-theme-catppuccin/**"
      - "packages/live-md-theme-github/**"
      - "packages/live-md-theme-gruvbox/**"
      - "packages/live-md-loro/**"
      - "packages/opendal-wasm-browser/**"
      - "packages/theme/**"
      - "packages/theme-catppuccin/**"
      - "packages/theme-github/**"
      - "packages/theme-gruvbox/**"
      - "packages/theme-palettes/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vite.shared.ts"
  push:
    branches:
      - main
    tags:
      - "grove-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing grove-v* tag to redeploy to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grove-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Resolve Grove scope
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.scope.outputs.deploy_branch }}
      deploy_target: ${{ steps.scope.outputs.deploy_target }}
      should_run: ${{ steps.scope.outputs.should_run }}
      skip_reason: ${{ steps.scope.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Check release and changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          changed_paths_file="$RUNNER_TEMP/grove-changed-paths.txt"
          relevant_paths_file="$RUNNER_TEMP/grove-relevant-paths.txt"
          : > "$changed_paths_file"
          : > "$relevant_paths_file"

          is_relevant_path() {
            local path="$1"

            case "$path" in
              ".github/workflows/local-md-workspace.yml" | \
              "bun.lock" | \
              "package.json" | \
              "vite.config.ts" | \
              "vite.shared.ts" | \
              tsconfig*.json)
                return 0
                ;;
              apps/local-md-workspace/src/* | \
              apps/local-md-workspace/scripts/* | \
              apps/local-md-workspace/public/* | \
              apps/local-md-workspace/index.html | \
              apps/local-md-workspace/package.json | \
              apps/local-md-workspace/tsconfig.json | \
              apps/local-md-workspace/vite.config.ts)
                return 0
                ;;
              apps/grove-relay/src/* | \
              apps/grove-relay/package.json | \
              apps/grove-relay/tsconfig.json | \
              apps/grove-relay/vite.config.ts | \
              apps/grove-relay/vitest.config.ts | \
              apps/grove-relay/worker-configuration.d.ts | \
              apps/grove-relay/wrangler.jsonc | \
              apps/grove-relay/wrangler.worker.ci.jsonc | \
              apps/grove-relay/wrangler.worker.jsonc)
                return 0
                ;;
            esac

            case "$path" in
              packages/autocomplete/src/* | \
              packages/codemirror/src/* | \
              packages/commands/src/* | \
              packages/language/src/* | \
              packages/language-data/src/* | \
              packages/live-md/src/* | \
              packages/live-md/vite-plugin.ts | \
              packages/live-md-theme/src/* | \
              packages/live-md-theme-catppuccin/src/* | \
              packages/live-md-theme-github/src/* | \
              packages/live-md-theme-gruvbox/src/* | \
              packages/live-md-loro/src/* | \
              packages/opendal-wasm-browser/src/* | \
              packages/opendal-wasm-browser/pkg/* | \
              packages/theme/src/* | \
              packages/theme-catppuccin/src/* | \
              packages/theme-github/src/* | \
              packages/theme-gruvbox/src/* | \
              packages/theme-palettes/src/*)
                return 0
                ;;
              packages/autocomplete/package.json | \
              packages/autocomplete/tsconfig.json | \
              packages/autocomplete/vite.config.ts | \
              packages/codemirror/package.json | \
              packages/codemirror/tsconfig.json | \
              packages/codemirror/vite.config.ts | \
              packages/commands/package.json | \
              packages/commands/tsconfig.json | \
              packages/commands/vite.config.ts | \
              packages/language/package.json | \
              packages/language/tsconfig.json | \
              packages/language/vite.config.ts | \
              packages/language-data/package.json | \
              packages/language-data/tsconfig.json | \
              packages/language-data/vite.config.ts | \
              packages/live-md/package.json | \
              packages/live-md/tsconfig.json | \
              packages/live-md/vite.config.ts | \
              packages/live-md-theme/package.json | \
              packages/live-md-theme/tsconfig.json | \
              packages/live-md-theme/vite.config.ts | \
              packages/live-md-theme-catppuccin/package.json | \
              packages/live-md-theme-catppuccin/tsconfig.json | \
              packages/live-md-theme-catppuccin/vite.config.ts | \
              packages/live-md-theme-github/package.json | \
              packages/live-md-theme-github/tsconfig.json | \
              packages/live-md-theme-github/vite.config.ts | \
              packages/live-md-theme-gruvbox/package.json | \
              packages/live-md-theme-gruvbox/tsconfig.json | \
              packages/live-md-theme-gruvbox/vite.config.ts | \
              packages/live-md-loro/package.json | \
              packages/live-md-loro/tsconfig.json | \
              packages/live-md-loro/vite.config.ts | \
              packages/opendal-wasm-browser/Cargo.lock | \
              packages/opendal-wasm-browser/Cargo.toml | \
              packages/opendal-wasm-browser/package.json | \
              packages/opendal-wasm-browser/tsconfig.json | \
              packages/opendal-wasm-browser/vite.config.ts | \
              packages/theme/package.json | \
              packages/theme/tsconfig.json | \
              packages/theme/vite.config.ts | \
              packages/theme-catppuccin/package.json | \
              packages/theme-catppuccin/tsconfig.json | \
              packages/theme-catppuccin/vite.config.ts | \
              packages/theme-github/package.json | \
              packages/theme-github/tsconfig.json | \
              packages/theme-github/vite.config.ts | \
              packages/theme-gruvbox/package.json | \
              packages/theme-gruvbox/tsconfig.json | \
              packages/theme-gruvbox/vite.config.ts | \
              packages/theme-palettes/package.json | \
              packages/theme-palettes/tsconfig.json | \
              packages/theme-palettes/vite.config.ts)
                return 0
                ;;
            esac

            return 1
          }

          collect_relevant_paths() {
            local found=false
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              if is_relevant_path "$path"; then
                echo "$path" >> "$relevant_paths_file"
                found=true
              fi
            done < "$changed_paths_file"

            if [ "$found" = true ]; then
              return 0
            fi
            return 1
          }

          ensure_tag_on_main() {
            local tag="$1"
            local tag_sha

            git fetch origin main --tags --force
            tag_sha="$(git rev-list -n 1 "$tag")"

            if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
              echo "::error::Release tag $tag does not point to a commit contained in origin/main."
              exit 1
            fi
          }

          should_run=false
          deploy_target=none
          deploy_branch=
          skip_reason="No Grove runtime-impacting paths changed."

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$RELEASE_TAG_INPUT"
            if [[ ! "$release_tag" == grove-v* ]]; then
              echo "::error::Manual production deploys require a grove-v* release tag."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$release_tag^{commit}" >/dev/null; then
              git fetch origin "refs/tags/$release_tag:refs/tags/$release_tag" --force
            fi
            ensure_tag_on_main "$release_tag"
            should_run=true
            deploy_target=production
            deploy_branch=main
            skip_reason=
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_paths_file"
            if collect_relevant_paths; then
              should_run=true
              deploy_target=validation
              skip_reason=
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
            if [[ ! "$release_tag" == grove-v* ]]; then
              echo "::error::Production deploy tags must match grove-v*."
              exit 1
            fi

            ensure_tag_on_main "$release_tag"
            previous_tag="$(git tag --list 'grove-v*' --sort=-v:refname | awk -v current="$release_tag" '$0 != current { print; exit }')"

            if [ -z "$previous_tag" ]; then
              should_run=true
              deploy_target=production
              deploy_branch=main
              skip_reason=
            else
              git diff --name-only "$previous_tag" "$release_tag" > "$changed_paths_file"
              if collect_relevant_paths; then
                should_run=true
                deploy_target=production
                deploy_branch=main
                skip_reason=
              else
                skip_reason="No Grove runtime-impacting paths changed since $previous_tag."
              fi
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            zero_sha="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero_sha" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA_VALUE" > "$changed_paths_file"
            else
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA_VALUE" > "$changed_paths_file"
            fi

            if collect_relevant_paths; then
              should_run=true
              deploy_target=validation
              skip_reason=
            fi
          fi

          {
            echo "should_run=$should_run"
            echo "deploy_target=$deploy_target"
            echo "deploy_branch=$deploy_branch"
            echo "skip_reason=$skip_reason"
          } >> "$GITHUB_OUTPUT"

          if [ "$should_run" = true ]; then
            {
              echo "### Grove scope"
              echo
              echo "- Target: \`$deploy_target\`"
              if [ -n "$deploy_branch" ]; then
                echo "- Deploy branch: \`$deploy_branch\`"
              fi
              if [ -s "$relevant_paths_file" ]; then
                echo
                echo "Relevant changes:"
                sed 's/^/- `/' "$relevant_paths_file" | sed 's/$/`/'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$skip_reason"
            {
              echo "### Grove skipped"
              echo
              echo "$skip_reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Validate Grove
    runs-on: ubuntu-latest
    needs:
      - scope
    if: ${{ needs.scope.outputs.should_run == 'true' }}
    env:
      GROVE_APP_ORIGIN: https://app.grovemd.net
      GROVE_DROPBOX_REDIRECT_URI: https://app.grovemd.net/
      GROVE_PAGES_CNAME: grove-6te.pages.dev
      GROVE_PAGES_DOMAINS: grovemd.net,app.grovemd.net
      GROVE_PAGES_PROJECT: grove
      GROVE_RELAY_ORIGIN: https://relay.grovemd.net
      GROVE_ROOT_ORIGIN: https://grovemd.net
      GROVE_ZONE_NAME: grovemd.net
      VITE_DROPBOX_APP_KEY: ${{ vars.VITE_DROPBOX_APP_KEY }}
      VITE_DROPBOX_REDIRECT_URI: ${{ vars.VITE_DROPBOX_REDIRECT_URI }}
      VITE_DROPBOX_ROOT: ${{ vars.VITE_DROPBOX_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: "26"

      - name: Install dependencies
        run: vp install

      - name: Validate Grove frontend config
        run: |
          set -euo pipefail

          if [ -z "${VITE_DROPBOX_APP_KEY:-}" ]; then
            echo "::error::VITE_DROPBOX_APP_KEY is required as a GitHub repository variable for Grove builds."
            exit 1
          fi

          dropbox_redirect_uri="${VITE_DROPBOX_REDIRECT_URI:-$GROVE_DROPBOX_REDIRECT_URI}"
          if ! normalized_dropbox_redirect_uri="$(node -e 'console.log(new URL(process.argv[1]).href)' "$dropbox_redirect_uri")"; then
            echo "::error::VITE_DROPBOX_REDIRECT_URI is not a valid URL."
            exit 1
          fi

          if [ "$normalized_dropbox_redirect_uri" != "$GROVE_DROPBOX_REDIRECT_URI" ]; then
            echo "::error::VITE_DROPBOX_REDIRECT_URI must be $GROVE_DROPBOX_REDIRECT_URI for Grove production builds."
            exit 1
          fi

          echo "VITE_DROPBOX_REDIRECT_URI=$GROVE_DROPBOX_REDIRECT_URI" >> "$GITHUB_ENV"

      - name: Build OpenDAL browser WASM
        run: |
          set -euo pipefail

          rustup target add wasm32-unknown-unknown
          vp run @codemirror-treesitter/opendal-wasm-browser#build:wasm

      - name: Check Grove relay Worker types
        run: |
          set -euo pipefail

          cd apps/grove-relay
          ../../node_modules/.bin/wrangler types --check

      - name: Check
        run: vp check

      - name: Check Grove i18n
        run: vp run local-md-workspace#i18n:check

      - name: Test
        run: vp run -r test

      - name: Build Grove relay
        run: vp run grove-relay#build

      - name: Validate Grove relay deploy config
        run: ./node_modules/.bin/wrangler deploy --dry-run --config apps/grove-relay/wrangler.worker.ci.jsonc

      - id: relay
        name: Resolve Grove relay origin
        env:
          CONFIGURED_RELAY_ORIGIN: ${{ vars.VITE_LOCAL_MD_SHARE_RELAY_ORIGIN }}
          DEPLOY_TARGET: ${{ needs.scope.outputs.deploy_target }}
        run: |
          set -euo pipefail

          normalize_origin() {
            node -e 'console.log(new URL(process.argv[1]).origin)' "$1"
          }

          relay_origin="$(normalize_origin "$GROVE_RELAY_ORIGIN")"
          if [ -n "${CONFIGURED_RELAY_ORIGIN:-}" ]; then
            if ! configured_relay_origin="$(normalize_origin "$CONFIGURED_RELAY_ORIGIN")"; then
              echo "::error::VITE_LOCAL_MD_SHARE_RELAY_ORIGIN is not a valid URL origin."
              exit 1
            fi
            if [ "$configured_relay_origin" != "$relay_origin" ]; then
              echo "::warning::Ignoring VITE_LOCAL_MD_SHARE_RELAY_ORIGIN=$configured_relay_origin; Grove relay deploys to $relay_origin."
            fi
          fi

          echo "relay_origin=$relay_origin" >> "$GITHUB_OUTPUT"

          {
            echo "### Grove relay"
            echo
            echo "- Worker deploy: $([ "$DEPLOY_TARGET" = "production" ] && echo "pending" || echo "skipped")"
            echo "- Origin: $relay_origin"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Grove
        env:
          VITE_LOCAL_MD_SHARE_RELAY_ORIGIN: ${{ steps.relay.outputs.relay_origin }}
        run: |
          set -euo pipefail

          build_log="$RUNNER_TEMP/grove-build.log"
          vp run local-md-workspace#build 2>&1 | tee "$build_log"

          if grep -Fq "doesn't exist at build time" "$build_log"; then
            echo "::error::Grove build has unresolved asset URLs. Check build warnings before deploying."
            exit 1
          fi

          if grep -R "packages/opendal-wasm-browser/pkg" apps/local-md-workspace/dist/assets/*.js >/dev/null; then
            echo "::error::Grove build still references the OpenDAL source package path at runtime."
            exit 1
          fi

          if ! find apps/local-md-workspace/dist/assets -name "opendal_wasm_browser-*.js" -print -quit | grep -q .; then
            echo "::error::Grove build did not emit the OpenDAL generated JS asset."
            exit 1
          fi

          if ! find apps/local-md-workspace/dist/assets -name "opendal_wasm_browser_bg-*.wasm" -print -quit | grep -q .; then
            echo "::error::Grove build did not emit the OpenDAL WASM asset."
            exit 1
          fi

          if ! grep -Fq "https://app.grovemd.net" apps/local-md-workspace/dist/_worker.js; then
            echo "::error::Grove Pages worker is missing the root-domain redirect target."
            exit 1
          fi

      - name: Deploy Grove relay Worker
        if: ${{ needs.scope.outputs.deploy_target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_ORIGIN: ${{ steps.relay.outputs.relay_origin }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const { CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, GROVE_ZONE_NAME } = process.env;

          if (!CLOUDFLARE_ACCOUNT_ID || !CLOUDFLARE_API_TOKEN) {
            throw new Error("Cloudflare account ID and API token are required.");
          }

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/zones?name=${encodeURIComponent(GROVE_ZONE_NAME)}`,
            { headers: { Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}` } },
          );
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.success === false) {
            const detail = body?.errors?.map((error) => error.message).join("; ") || response.statusText;
            throw new Error(`Could not verify Cloudflare zone ${GROVE_ZONE_NAME}: ${detail}`);
          }

          const zone = body.result?.find(
            (candidate) => candidate?.name === GROVE_ZONE_NAME && candidate?.account?.id === CLOUDFLARE_ACCOUNT_ID,
          );
          if (!zone) {
            console.error(
              `::error::Cloudflare zone ${GROVE_ZONE_NAME} is not visible in the configured Cloudflare account. Add the zone to the same account as the Grove Pages project, or update CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN.`,
            );
            process.exit(1);
          }
          if (zone.status !== "active") {
            console.error(
              `::error::Cloudflare zone ${GROVE_ZONE_NAME} is ${zone.status}; Worker custom domains require an active zone.`,
            );
            process.exit(1);
          }
          NODE

          output_file="$RUNNER_TEMP/wrangler-worker-deploy.log"
          ./node_modules/.bin/wrangler deploy \
            --config apps/grove-relay/wrangler.worker.ci.jsonc 2>&1 | tee "$output_file"

          {
            echo "### Grove relay deployment"
            echo
            echo "- Worker: \`grove-relay\`"
            echo "- Origin: $RELAY_ORIGIN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Grove to Cloudflare Pages
        if: ${{ needs.scope.outputs.deploy_target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_BRANCH: ${{ needs.scope.outputs.deploy_branch }}
          DEPLOY_TARGET: ${{ needs.scope.outputs.deploy_target }}
          RELAY_ORIGIN: ${{ steps.relay.outputs.relay_origin }}
        run: |
          set -euo pipefail

          output_file="$RUNNER_TEMP/wrangler-pages-deploy.log"
          commit_hash="$(git rev-parse HEAD)"
          commit_message="$(git log -1 --pretty=%s)"

          ./node_modules/.bin/wrangler pages deploy apps/local-md-workspace/dist \
            --project-name "$GROVE_PAGES_PROJECT" \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$commit_hash" \
            --commit-message "$commit_message" \
            --commit-dirty=false 2>&1 | tee "$output_file"

          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev[^[:space:]]*' "$output_file" | tail -n 1 || true)"

          {
            echo "### Grove $DEPLOY_TARGET deployment"
            echo
            echo "- Cloudflare Pages project: \`$GROVE_PAGES_PROJECT\`"
            echo "- App origin: $GROVE_APP_ORIGIN"
            echo "- Root origin: $GROVE_ROOT_ORIGIN"
            echo "- Branch: \`$DEPLOY_BRANCH\`"
            echo "- Commit: \`$commit_hash\`"
            echo "- Relay origin: $RELAY_ORIGIN"
            if [ -n "$deployment_url" ]; then
              echo "- URL: $deployment_url"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure Grove Pages custom domain
        if: ${{ needs.scope.outputs.deploy_target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const {
            CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_API_TOKEN,
            GITHUB_STEP_SUMMARY,
            GROVE_PAGES_DOMAINS,
            GROVE_PAGES_PROJECT,
          } = process.env;

          if (!CLOUDFLARE_ACCOUNT_ID || !CLOUDFLARE_API_TOKEN) {
            throw new Error("Cloudflare account ID and API token are required.");
          }

          const targetDomains = (GROVE_PAGES_DOMAINS ?? "")
            .split(",")
            .map((domain) => domain.trim())
            .filter(Boolean);
          if (!targetDomains.length) {
            throw new Error("GROVE_PAGES_DOMAINS must include at least one domain.");
          }

          const project = encodeURIComponent(GROVE_PAGES_PROJECT);
          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains`;

          async function cloudflare(path, init = {}) {
            const response = await fetch(path, {
              ...init,
              headers: {
                Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}`,
                "Content-Type": "application/json",
                ...(init.headers ?? {}),
              },
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || body?.success === false) {
              let detail = body?.errors?.map((error) => error.message).join("; ") || response.statusText;
              throw new Error(`Cloudflare Pages domain API failed: ${detail}`);
            }
            return body;
          }

          function domainList(result) {
            if (Array.isArray(result)) return result;
            if (Array.isArray(result?.domains)) return result.domains;
            return [];
          }

          const existing = await cloudflare(baseUrl);
          const domains = domainList(existing.result);
          const statuses = [];
          for (const domain of targetDomains) {
            if (!domains.some((entry) => entry?.name === domain)) {
              await cloudflare(baseUrl, {
                method: "POST",
                body: JSON.stringify({ name: domain }),
              });
            }

            const current = await cloudflare(`${baseUrl}/${encodeURIComponent(domain)}`);
            const status =
              current.result?.status ??
              current.result?.verification_data?.status ??
              current.result?.verification_status ??
              "unknown";
            statuses.push({ domain, status });
          }

          await import("node:fs").then((fs) => {
            fs.appendFileSync(
              GITHUB_STEP_SUMMARY,
              `\n### Grove custom domains\n\n${statuses
                .map(({ domain, status }) => `- Pages domain: ${domain} (${status})`)
                .join("\n")}\n`,
            );
          });
          NODE

      - name: Ensure Grove Pages DNS records
        if: ${{ needs.scope.outputs.deploy_target == 'production' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const {
            CLOUDFLARE_ACCOUNT_ID,
            CLOUDFLARE_API_TOKEN,
            GITHUB_STEP_SUMMARY,
            GROVE_PAGES_CNAME,
            GROVE_PAGES_DOMAINS,
            GROVE_ZONE_NAME,
          } = process.env;

          if (!CLOUDFLARE_ACCOUNT_ID || !CLOUDFLARE_API_TOKEN) {
            throw new Error("Cloudflare account ID and API token are required.");
          }

          const target = normalizeDnsName(GROVE_PAGES_CNAME);
          if (!target) throw new Error("GROVE_PAGES_CNAME must be set.");

          const domains = (GROVE_PAGES_DOMAINS ?? "")
            .split(",")
            .map((domain) => normalizeDnsName(domain))
            .filter(Boolean);
          if (!domains.length) {
            throw new Error("GROVE_PAGES_DOMAINS must include at least one domain.");
          }

          async function cloudflare(path, init = {}, context = path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}`,
                "Content-Type": "application/json",
                ...(init.headers ?? {}),
              },
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || body?.success === false) {
              const detail =
                body?.errors?.map((error) => `${error.code}: ${error.message}`).join("; ") ??
                response.statusText;
              throw new Error(
                `Cloudflare DNS API failed while ${context}: ${detail}. ` +
                  `The Cloudflare API token must include Zone:DNS:Edit for ${GROVE_ZONE_NAME}.`,
              );
            }
            return body;
          }

          function normalizeDnsName(name) {
            return (name ?? "").trim().replace(/\.$/, "").toLowerCase();
          }

          function recordPayload(name) {
            return {
              content: target,
              name,
              proxied: true,
              ttl: 1,
              type: "CNAME",
            };
          }

          const zones = await cloudflare(
            `/zones?name=${encodeURIComponent(GROVE_ZONE_NAME)}`,
            {},
            `looking up zone ${GROVE_ZONE_NAME}`,
          );
          const zone = zones.result?.find(
            (candidate) =>
              candidate?.name === GROVE_ZONE_NAME && candidate?.account?.id === CLOUDFLARE_ACCOUNT_ID,
          );
          if (!zone) {
            throw new Error(`Cloudflare zone ${GROVE_ZONE_NAME} is not visible in the configured account.`);
          }

          const changes = [];
          for (const domain of domains) {
            const records = await cloudflare(
              `/zones/${zone.id}/dns_records?name=${encodeURIComponent(domain)}`,
              {},
              `listing DNS records for ${domain}`,
            );
            const conflicting = records.result?.filter((record) =>
              ["A", "AAAA", "CNAME"].includes(record?.type),
            ) ?? [];
            const [primaryCname, ...extraCnames] = conflicting.filter(
              (record) => record.type === "CNAME",
            );

            for (const record of conflicting.filter((record) => record.type !== "CNAME")) {
              await cloudflare(
                `/zones/${zone.id}/dns_records/${record.id}`,
                { method: "DELETE" },
                `removing ${record.type} record for ${domain}`,
              );
              changes.push(`${domain}: removed ${record.type}`);
            }

            for (const record of extraCnames) {
              await cloudflare(
                `/zones/${zone.id}/dns_records/${record.id}`,
                { method: "DELETE" },
                `removing duplicate CNAME record for ${domain}`,
              );
              changes.push(`${domain}: removed duplicate CNAME`);
            }

            if (primaryCname) {
              const currentTarget = normalizeDnsName(primaryCname.content);
              if (currentTarget !== target || primaryCname.proxied !== true) {
                await cloudflare(
                  `/zones/${zone.id}/dns_records/${primaryCname.id}`,
                  { method: "PUT", body: JSON.stringify(recordPayload(domain)) },
                  `updating CNAME record for ${domain}`,
                );
                changes.push(`${domain}: updated CNAME -> ${target}`);
              } else {
                changes.push(`${domain}: CNAME already points to ${target}`);
              }
            } else {
              await cloudflare(
                `/zones/${zone.id}/dns_records`,
                { method: "POST", body: JSON.stringify(recordPayload(domain)) },
                `creating CNAME record for ${domain}`,
              );
              changes.push(`${domain}: created CNAME -> ${target}`);
            }
          }

          await import("node:fs").then((fs) => {
            fs.appendFileSync(
              GITHUB_STEP_SUMMARY,
              `\n### Grove DNS records\n\n${changes.map((change) => `- ${change}`).join("\n")}\n`,
            );
          });
          NODE
